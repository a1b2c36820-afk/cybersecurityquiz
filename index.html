<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>你是哪一種資安熊？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1FA35C; --green-deep:#168049; --green-tint:#E4F5EB;
  --paper:#FFFFFF; --ink:#000000; --on-green:#FFFFFF;
  --alert:#F0532B; --muted:#4A4A4A;
  --line:3px; --r-big:28px; --r-pill:999px;
  --shadow:5px 5px 0 var(--ink);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --green:#147A44; --green-deep:#0E5C33; --green-tint:#DDEFE4;
    --on-green:#FFFFFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{--green:#147A44; --green-deep:#0E5C33; --green-tint:#DDEFE4; --on-green:#FFFFFF; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{
  background:var(--green); color:var(--on-green);
  font-family:"Huninn","jf open 粉圓","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  font-size:17px; line-height:1.6;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:480px;margin:0 auto;padding:20px 20px 36px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
img{max-width:100%;display:block}
/* chunky outlined display type, echoing the poster letters */
.chunk{
  font-weight:400; color:var(--paper);
  -webkit-text-stroke:calc(var(--line) * 2) var(--ink); paint-order:stroke fill;
  letter-spacing:.02em; line-height:1.15;
}
.btn{
  appearance:none; font:inherit; cursor:pointer;
  border:var(--line) solid var(--ink); border-radius:var(--r-pill);
  background:var(--paper); color:var(--ink);
  padding:14px 28px; font-size:20px; box-shadow:var(--shadow);
  transition:transform .12s, box-shadow .12s;
  touch-action:manipulation;
}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.opt:focus-visible,.back:focus-visible,summary:focus-visible{outline:4px solid var(--alert);outline-offset:3px}
.btn.alt{background:var(--alert);color:var(--paper)}

/* cover */
.poster{border:var(--line) solid var(--ink);border-radius:var(--r-big);overflow:hidden;box-shadow:var(--shadow);background:var(--paper)}
.cover-copy{text-align:center;margin:26px 0 22px}
.cover-copy h1{font-size:30px;margin:0 0 6px}
.cover-copy p{margin:0;font-size:16px;opacity:.95}
.cover .btn{align-self:center;min-width:220px}
.fine{text-align:center;font-size:14px;margin-top:16px;opacity:.85}

/* quiz */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.back{appearance:none;font:inherit;cursor:pointer;width:44px;height:44px;flex:none;border:var(--line) solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);font-size:22px;line-height:1;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink)}
.back[hidden]{visibility:hidden;display:grid}
.count{flex:1;text-align:right;font-size:16px}
.count b{font-size:24px;font-weight:400}
.bar{height:22px;border:var(--line) solid var(--ink);border-radius:var(--r-pill);background:var(--green-deep);overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:0;background:var(--paper);border-right:var(--line) solid var(--ink);transition:width .35s ease}
.card{background:var(--paper);color:var(--ink);border:var(--line) solid var(--ink);border-radius:var(--r-big);box-shadow:var(--shadow);padding:22px 20px 24px}
.tag{display:inline-block;font-size:14px;padding:2px 12px;border:2px solid var(--ink);border-radius:var(--r-pill);margin-bottom:10px}
.tag.office{background:var(--green-tint)}
.tag.home{background:#FFE7DF}
.tag.crypto{background:var(--ink);color:var(--paper)}
.qtitle{font-size:22px;line-height:1.35;margin:0 0 8px}
.qbody{margin:0 0 18px;font-size:17px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  appearance:none;font:inherit;text-align:left;cursor:pointer;width:100%;
  display:flex;gap:12px;align-items:flex-start;
  background:var(--paper);color:var(--ink);
  border:var(--line) solid var(--ink);border-radius:20px;padding:12px 14px;
  box-shadow:3px 3px 0 var(--ink);transition:transform .1s, box-shadow .1s, background .15s;
  touch-action:manipulation;font-size:16.5px;line-height:1.5;
}
.opt .k{flex:none;width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--green-tint);margin-top:-1px}
@media (hover:hover){.opt:hover{background:var(--green-tint)}}
.opt.picked{background:var(--green);color:var(--paper);transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.opt.picked .k{background:var(--paper);color:var(--ink)}
.slide{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* result */
.result-head{text-align:center;margin:6px 0 16px}
.result-head p{margin:0;font-size:18px}
.result-head h2{font-size:42px;margin:2px 0 0}
.bear-card{padding:0;overflow:hidden}
.bear-card img{width:100%;aspect-ratio:1/1;object-fit:cover}
.bear-meta{padding:4px 22px 24px;border-top:var(--line) solid var(--ink)}
.meter{display:flex;align-items:center;gap:10px;margin:14px 0 12px;font-size:15px}
.dots{display:flex;gap:5px}
.dots span{width:16px;height:16px;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.dots span.f{background:var(--green)}
.score{margin-left:auto;font-size:15px}
.desc{margin:0 0 16px;font-size:16.5px}
.tip{border:2px solid var(--ink);border-radius:18px;padding:12px 14px;background:#FFF1EC;position:relative}
.tip strong{display:block;font-weight:400;color:var(--alert);font-size:15px;margin-bottom:2px}
.tip p{margin:0;font-size:16px}
.actions{display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:26px}
.actions .btn{min-width:220px}
details.review{margin-top:22px}
details.review summary{cursor:pointer;list-style:none;text-align:center;font-size:16px;padding:10px;text-decoration:underline;text-underline-offset:4px}
details.review summary::-webkit-details-marker{display:none}
.rv{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.rv li{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:18px;padding:12px 14px;font-size:15px}
.rv .rq{font-size:16px;margin-bottom:4px}
.rv .ra{color:var(--muted);margin-bottom:6px}
.rv .pt{display:inline-block;border:2px solid var(--ink);border-radius:var(--r-pill);padding:0 8px;font-size:13px;margin-left:4px;vertical-align:1px}
.rv .pt.full{background:var(--green);color:var(--paper)}
.rv .pt.zero{background:var(--alert);color:var(--paper)}
.rv .ex{margin:0;line-height:1.55}
@media (min-width:600px){
  .wrap{padding-top:36px}
  .qtitle{font-size:24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

 {c:"office", t:"半夜的登入通知", b:"深夜你的手機連續跳出 5 次公司帳號的「登入核准」通知，但你根本沒有在登入。你會？",

 {c:"office", t:"IT 要遠端幫你修電腦", b:"你在 Teams 收到一則外部訊息，對方自稱公司 IT，說偵測到你的電腦中毒，請你安裝 AnyDesk 讓他遠端處理。你會？",

 {c:"home", t:"停車格上的 QR Code", b:"路邊停車格的柱子上貼著「掃碼繳費更方便」的 QR Code 貼紙，看起來和路邊的標示風格一致。你會？",

const $ = id => document.getElementById(id);
let cur = 0, picks = [], locked = false, order = [];
function shuffleAll(){
  order = Q.map(q=>{ const a=q.o.map((_,i)=>i); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; });
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id));
  window.scrollTo(0,0);
}

function renderQ(){
  const q = Q[cur];
  $('qn').textContent = cur+1;
  $('fill').style.width = (cur/Q.length*100)+'%';
  $('bar').setAttribute('aria-valuenow', cur);
  $('back').hidden = cur===0;
  const keys = 'ABCD';
  const card = $('qcard');
  card.classList.remove('slide'); void card.offsetWidth; card.classList.add('slide');
  card.innerHTML = `
    <span class="tag ${q.c}">${{office:'辦公室',home:'日常生活',crypto:'加密知識'}[q.c]}</span>
    <h2 class="qtitle">${q.t}</h2>
    <p class="qbody">${q.b}</p>
    <div class="opts" role="group" aria-label="選項">
      ${order[cur].map((i,pos)=>`<button class="opt${picks[cur]===i?' picked':''}" data-i="${i}"><span class="k" aria-hidden="true">${keys[pos]}</span><span>${q.o[i][0]}</span></button>`).join('')}
    </div>`;
  card.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.i,b)));
  locked = false;
}

function choose(i, el){
  if(locked) return; locked = true;
  picks[cur] = i;
  el.parentNode.querySelectorAll('.opt').forEach(b=>b.classList.remove('picked'));
  el.classList.add('picked');
  $('fill').style.width = ((cur+1)/Q.length*100)+'%';
  setTimeout(()=>{
    if(cur < Q.length-1){ cur++; renderQ(); }
    else finish();
  }, 380);
}

function judge(){
  let score=0, over=0, trap=0;
  picks.forEach((p,qi)=>{ const o=Q[qi].o[p]; score+=o[1]; if(o[2]===1) over++; if(o[2]===2) trap++; });
  let k;
  if(over>=3) k='nervous';
  else if(trap>=4) k='half';
  else if(score>=27) k='warrior';
  else if(score>=20) k='detective';
  else if(score>=10) k='trusting';
  else k='slime';
  return {k, score};
}

function finish(){
  const {k, score} = judge();
  const b = B[k];
  $('rname').textContent = b.n;
  $('rimg').src = IMG[b.img];
  $('rimg').alt = b.n+'的插圖';
  $('rdots').innerHTML = Array.from({length:5},(_,i)=>`<span class="${i<b.s?'f':''}"></span>`).join('');
  $('rdots').setAttribute('aria-label', `資安意識 ${b.s} 顆星，滿分 5 顆`);
  $('rscore').textContent = `得分 ${score}／30`;
  $('rdesc').textContent = b.d;
  $('rtip').textContent = b.t;
  $('rv').innerHTML = Q.map((q,qi)=>{
    const o = q.o[picks[qi]];
    const cls = o[1]===3?'full':(o[1]===0?'zero':'');
    return `<li><div class="rq">${qi+1}. ${q.t}</div><div class="ra">你選了：${o[0]}<span class="pt ${cls}">${o[1]} 分</span></div><p class="ex">${q.x}</p></li>`;
  }).join('');
  $('review').open = false;
  show('result');
}

$('start').addEventListener('click',()=>{ cur=0; picks=[]; shuffleAll(); renderQ(); show('quiz'); });
$('back').addEventListener('click',()=>{ if(cur>0 && !locked){ cur--; renderQ(); } });
$('again').addEventListener('click',()=>{ cur=0; picks=[]; show('cover'); });
</script>
